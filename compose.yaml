services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/claims.db
    ports: ["8000:8000"]
    volumes: ["claims_data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  claims_data:
