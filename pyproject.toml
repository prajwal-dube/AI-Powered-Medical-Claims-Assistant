[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-claims-assistant"
version = "0.1.0"
description = "Synthetic healthcare document extraction and claim review demo"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "python-multipart>=0.0.9,<1",
  "pydantic>=2.6,<3", "httpx>=0.26,<1", "pypdf>=4,<7"
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32,<2", "pandas>=2,<3", "requests>=2.31,<3"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["claims_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
